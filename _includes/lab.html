<div class="lab">
  <img src="/assets/img/lab.webp" alt="An isometric research lab where each object leads to a part of this site" width="1800" height="1385">
  <svg class="lab-hits" viewBox="0 0 1000 769" aria-hidden="true">
    {% for s in site.data.stations %}{% if s.points %}
    <a href="{{ s.url }}" tabindex="-1"><polygon points="{{ s.points }}"/></a>
    {% endif %}{% endfor %}
  </svg>
  {% for s in site.data.stations %}
  <a class="station" href="{{ s.url }}" style="left: {{ s.label_x }}%; top: {{ s.label_y }}%;">{{ s.name }}</a>
  {% endfor %}
</div>

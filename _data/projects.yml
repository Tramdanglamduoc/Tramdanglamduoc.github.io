- title: Multilingual personal health record
  context: Personal project · 2026
  problem: Health records rarely travel well across languages and countries.
  method: A static web app in six languages with on-device translation; data stays in the browser's local storage.
  result: A working tool anyone can open in a browser, with no server and no account.
  tags: [Health informatics, Web]
